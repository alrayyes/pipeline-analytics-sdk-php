version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    commit-message:
      # Ships in the published package - a bump here is a change to what
      # ships whether or not it's security-relevant, so fix: cuts a patch
      # the same way any other fix does (rules/releases.md).
      prefix: fix
    groups:
      # Rector runs on classes from the phpstan phar, and each Rector
      # release requires a minimum phpstan. Pinned exactly, neither can
      # move alone without breaking lint (#166).
      static-analysis:
        patterns:
          - "phpstan/*"
          - "rector/*"

  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    commit-message:
      # Nothing here is JavaScript that ships - package.json exists for
      # commitlint tooling only, same reasoning as the sibling go/node SDKs.
      prefix: chore

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
