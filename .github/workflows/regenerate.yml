name: Regenerate from spec

on:
  repository_dispatch:
    types: [pipeline-analytics-spec-updated]
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Keep the spec at its currently-pinned commit for a moment longer
        run: cp openapi/openapi.yaml /tmp/before.yaml

      - name: Bump the pinned spec commit to pipeline-analytics' current main
        id: bump
        run: |
          before=$(cat openapi/SPEC_COMMIT)
          after=$(gh api repos/alrayyes/pipeline-analytics/commits/main --jq '.sha')
          echo "$after" > openapi/SPEC_COMMIT
          if [ "$after" = "$before" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Fetch the spec at that commit
        if: steps.bump.outputs.changed == 'true'
        run: ./hack/fetch-spec.sh

      - name: Install oasdiff
        if: steps.bump.outputs.changed == 'true'
        # go install alone doesn't put it on PATH for the next step -- a
        # plain `run:` is a fresh non-login shell each time. Same bug
        # hush-hush-python found and fixed (PR #13): skipping this makes
        # every regeneration look breaking, since `oasdiff` "command not
        # found" is a non-zero exit like any other.
        run: |
          go install github.com/oasdiff/oasdiff@v1.11.6
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Classify the spec change
        # Diff the spec, not the generated code, to decide the version bump
        # -- rules/sdk-generation.md's "Versioning tracks the contract, not
        # the commits". This becomes the PR's Conventional Commits marker
        # below, so release-please computes the right semver bump without a
        # human having to read the diff and decide by hand.
        if: steps.bump.outputs.changed == 'true'
        id: classify
        run: |
          if oasdiff breaking /tmp/before.yaml openapi/openapi.yaml --fail-on ERR > /tmp/breaking.txt 2>&1; then
            echo "breaking=false" >> "$GITHUB_OUTPUT"
          else
            echo "breaking=true" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "report<<EOF"
            cat /tmp/breaking.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Regenerate the client
        if: steps.bump.outputs.changed == 'true'
        run: ./scripts/generate.sh

      - name: Build commit message
        if: steps.bump.outputs.changed == 'true'
        id: message
        run: |
          if [ "${{ steps.classify.outputs.breaking }}" = "true" ]; then
            {
              echo "title=fix!: regenerate client from pipeline-analytics openapi.yaml"
              echo "body<<EOF"
              echo "BREAKING CHANGE: pipeline-analytics' spec changed in a way oasdiff classifies as breaking."
              echo
              echo '```'
              echo "${{ steps.classify.outputs.report }}"
              echo '```'
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "title=fix: regenerate client from pipeline-analytics openapi.yaml"
              echo "body=oasdiff classifies this spec change as additive/non-breaking."
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Open a pull request if anything changed
        # A regenerated SDK can touch every file in the repo -- real review,
        # not the Renovate/Dependabot self-merge exception
        # (rules/sdk-generation.md's "Regeneration in CI"). token is
        # RELEASE_TOKEN, not GITHUB_TOKEN: a GITHUB_TOKEN-authored PR needs a
        # human approval GitHub itself injects, and its own checks can come
        # back completely empty rather than just failing
        # (rules/releases.md's hush-hush-* codegen precedent).
        if: steps.bump.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          commit-message: ${{ steps.message.outputs.title }}
          title: ${{ steps.message.outputs.title }}
          body: ${{ steps.message.outputs.body }}
          branch: chore/regenerate-spec
          labels: dependencies
