name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.3"
          coverage: pcov
      - name: composer install
        run: composer install --no-interaction --prefer-dist
      - name: PHPUnit
        run: >-
          vendor/bin/phpunit --log-junit junit.xml
          --coverage-clover coverage.xml
      - name: Upload coverage/test-result reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reports
          path: |
            coverage.xml
            junit.xml

  # Codecov's upload needs CODECOV_TOKEN to exist to succeed at all on this
  # account's protected default branch, and that secret is a known-pending
  # manual step (same shape as every other Codecov-gated repo here) -- kept
  # out of the required `test` job so a missing token can't block every
  # future merge, including release-please's own release PR (confirmed live
  # on pipeline-analytics-sdk-node: bundling this into a required check did
  # exactly that).
  coverage:
    runs-on: ubuntu-latest
    needs: test
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: reports
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: true
      - name: Upload test results to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: junit.xml
          fail_ci_if_error: true

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.3"
      - name: composer install
        run: composer install --no-interaction --prefer-dist
      - name: composer normalize
        run: composer normalize --dry-run
      - name: Pint
        run: vendor/bin/pint --test
      - name: PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=512M
      - name: Rector
        run: vendor/bin/rector process --dry-run

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.3"
      - name: composer install
        run: composer install --no-interaction --prefer-dist
      - name: composer audit
        run: composer audit

  generated-code-is-fresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Regenerating from the pinned spec reproduces the committed client
        run: |
          ./hack/fetch-spec.sh
          ./scripts/generate.sh
          git diff --exit-code openapi/openapi.yaml generated/
      - name: Every generated file still carries the DO-NOT-EDIT header
        run: |
          missing=$(find generated/src -name '*.php' -print0 \
            | xargs -0 grep -L 'Do not edit the class manually.' || true)
          if [ -n "$missing" ]; then
            echo "Missing the DO-NOT-EDIT header:"
            echo "$missing"
            exit 1
          fi
