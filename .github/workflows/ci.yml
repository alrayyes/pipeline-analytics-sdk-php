name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.3"
          coverage: pcov
      - name: composer install
        run: composer install --no-interaction --prefer-dist
      - name: PHPUnit
        run: >-
          vendor/bin/phpunit --log-junit junit.xml
          --coverage-clover coverage.xml
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: true
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: junit.xml
          fail_ci_if_error: true

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.3"
      - name: composer install
        run: composer install --no-interaction --prefer-dist
      - name: composer normalize
        run: composer normalize --dry-run
      - name: Pint
        run: vendor/bin/pint --test
      - name: PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=512M
      - name: Rector
        run: vendor/bin/rector process --dry-run

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.3"
      - name: composer install
        run: composer install --no-interaction --prefer-dist
      - name: composer audit
        run: composer audit

  generated-code-is-fresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Regenerating from the pinned spec reproduces the committed client
        run: |
          ./hack/fetch-spec.sh
          ./scripts/generate.sh
          git diff --exit-code openapi/openapi.yaml generated/
      - name: Every generated file still carries the DO-NOT-EDIT header
        run: |
          missing=$(find generated/src -name '*.php' -print0 \
            | xargs -0 grep -L 'Do not edit the class manually.' || true)
          if [ -n "$missing" ]; then
            echo "Missing the DO-NOT-EDIT header:"
            echo "$missing"
            exit 1
          fi
