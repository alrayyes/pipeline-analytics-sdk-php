# The full-codebase mutation run rules/php.md asks a scheduled job carry,
# since ci.yml's own `mutation` job only ever mutates a pull request's own
# diff. No minMsi gate yet -- infection.json5's own comment explains why.
name: mutation

on:
  schedule:
    - cron: "0 8 * * 0" # weekly, Sunday 08:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.3"
          coverage: pcov
      - run: composer install --no-interaction --prefer-dist
      - run: composer infection
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: pipeline-analytics-sdk-php-infection-log
          path: infection.log
