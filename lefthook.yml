pre-commit:
  parallel: false
  commands:
    pint:
      # Scoped to src/tests, never a bare "*.php": pint.json's own
      # "exclude" for generated/ only applies when Pint discovers files
      # itself, not when explicit paths are passed on the command line
      # (confirmed live -- passing a generated/ file directly reformats
      # it regardless of the config). A staged generated/ file (the
      # initial bootstrap commit, or a regeneration PR) must never reach
      # {staged_files} here at all.
      glob: "{src,tests}/**/*.php"
      run: vendor/bin/pint {staged_files} && git add {staged_files}

commit-msg:
  commands:
    commitlint:
      run: bunx commitlint --edit {1}

pre-push:
  parallel: false
  commands:
    composer-normalize:
      run: composer normalize:lint
    pint:
      run: vendor/bin/pint --test
    phpstan:
      run: vendor/bin/phpstan analyse --memory-limit=512M
    phpmd:
      run: composer phpmd
    rector:
      run: vendor/bin/rector process --dry-run
    test:
      run: vendor/bin/pest
    audit:
      run: composer audit
    bearer:
      # --diff against the base branch, not a full scan: too slow to run
      # on every push per rules/php.md.
      #
      # The image's own default (non-root) user can't write
      # .git/index.lock in the bind-mounted repo, owned by the host's
      # uid -- confirmed live: "Unable to create '/src/.git/index.lock':
      # Permission denied" the moment bearer's --diff tries to switch to
      # the base branch. --user root plus its own safe.directory (this
      # container's git config is its own, not the host's) fixes it the
      # same way CI's own bearer job does.
      run: >-
        docker run --rm -v "$(pwd):/src" -w /src --user root --entrypoint sh
        bearer/bearer:2.1.1@sha256:054087ae504572bea7385f33c6a278571d03919fdc05f042c4de827b84ba2210
        -c "git config --global --add safe.directory /src && bearer scan src tests hack scripts --diff"
